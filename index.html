<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odliczanie do Naszego Bycia Razem ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-silk: #e2e8f0;
            --rose-petal: #38bdf8;
            --dusty-rose: #818cf8;
            --deep-velvet: #0f172a;
            --velvet-wine: #1e1b4b;
            --warm-gold: #f43f5e;
            --soft-gold: #fda4af;
            --card-glass: rgba(15, 23, 42, 0.85);
            --border-glow: rgba(244, 63, 94, 0.35);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
            touch-action: manipulation;
            color: #fff;
        }

        .emoji-fix {
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif !important;
            font-style: normal !important;
            font-weight: normal !important;
            display: inline-block;
            vertical-align: middle;
        }

        .ambient-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.22) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            animation: pulseGlow 6s ease-in-out infinite alternate;
            -webkit-animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.95; }
        }

        .top-bar {
            position: absolute;
            top: 22px;
            display: flex;
            gap: 12px;
            z-index: 2000;
        }

        .status-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glow);
            padding: 8px 18px;
            border-radius: 99px;
            color: var(--soft-gold);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
        }

        .combo-pulse {
            transform: scale(1.12);
            border-color: var(--warm-gold);
            background: rgba(244, 63, 94, 0.25);
            color: #fff;
        }

        .score-popup {
            position: absolute;
            font-size: 24px;
            font-weight: 800;
            color: var(--warm-gold);
            pointer-events: none;
            z-index: 3000;
            text-shadow: 0 0 18px rgba(244, 63, 94, 0.9);
            animation: floatUpScore 0.85s ease-out forwards;
        }

        @keyframes floatUpScore {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
            100% { transform: translate(-50%, -85px) scale(1.3); opacity: 0; }
        }

        #floating-emojis-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 1000;
        }

        .falling-emoji {
            position: absolute;
            top: -60px;
            pointer-events: auto !important;
            cursor: pointer;
            z-index: 1001 !important;
            will-change: transform, opacity;
            animation: floatDown 8.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            filter: drop-shadow(0 8px 16px rgba(244, 63, 94, 0.4));
            touch-action: manipulation;
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif !important;
        }

        @keyframes floatDown {
            0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(0.85); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate3d(0, 115vh, 0) rotate(180deg) scale(1.1); opacity: 0; }
        }

        .burst-glitter {
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            font-size: 24px;
            will-change: transform, opacity;
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif !important;
        }

        .container {
            text-align: center;
            background: var(--card-glass);
            padding: 2.5rem 1.8rem 2.2rem;
            border-radius: 40px;
            box-shadow: 0 35px 100px rgba(0, 0, 0, 0.85), 
                        0 0 60px rgba(244, 63, 94, 0.12);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            max-width: 92%;
            width: 420px;
            box-sizing: border-box;
            z-index: 10;
            border: 1px solid var(--border-glow);
            position: relative;
            margin-top: 30px;
        }

        .eyebrow {
            font-family: 'Great Vibes', cursive;
            font-size: 2.7rem;
            color: var(--warm-gold);
            margin-bottom: 2px;
            display: block;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
            line-height: 1.1;
        }

        h1 {
            font-size: 1.25rem;
            margin-top: 6px;
            margin-bottom: 0.6rem;
            font-weight: 600;
            line-height: 1.45;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .highlight-name {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            background: linear-gradient(120deg, #ffffff 10%, #fda4af 50%, #f43f5e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
            font-size: 1.7rem;
            display: block;
            margin-top: 6px;
        }

        .emoji-banner {
            font-size: 1.8rem;
            margin: 10px 0 16px;
            letter-spacing: 4px;
        }

        .romantic-quote {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--warm-gold);
            border-right: 3px solid var(--warm-gold);
            border-radius: 16px;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1.5rem;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.93rem;
            color: var(--soft-gold);
            line-height: 1.5;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .quote-author {
            display: block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-style: normal;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--warm-gold);
            margin-top: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .time-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: 22px;
            padding: 1rem 0.3rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .time-card .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -0.5px;
            display: block;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .time-card .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--soft-gold);
            margin-top: 6px;
            display: block;
            font-weight: 700;
            opacity: 0.9;
        }

        .totals-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .total-card {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(129, 140, 248, 0.15));
            border: 1px solid rgba(244, 63, 94, 0.4);
            border-radius: 22px;
            padding: 1.1rem 0.5rem;
            box-shadow: 0 12px 30px rgba(244, 63, 94, 0.15);
            position: relative;
            overflow: hidden;
        }

        .total-card .number {
            font-size: 2.1rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -0.5px;
            display: block;
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.85);
        }

        .total-card .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--soft-gold);
            margin-top: 6px;
